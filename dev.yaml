# Lima config for the single dev VM.
#
# Replaces every .devcontainer/ in ~/projects. This file plus README.md is the
# whole environment — if something is installed in the VM and NOT in here, that
# is a bug in this file, not a fact about the VM. There are no snapshots
# (see README "Recovery"), so reprovisioning is the only recovery path and it
# must stay complete.
#
#   limactl start ~/projects/current/devvm/dev.yaml --name=dev
#
# Translated from a per-project .devcontainer/{Dockerfile,post-create.sh}. Steps
# that existed only to work around container boundaries were dropped, not
# ported — each one is marked "GONE:" below so the omission is deliberate and
# reviewable rather than an oversight.

# --- Machine ------------------------------------------------------------------
# vz = Apple's Virtualization.framework (native, fast). Trade-off: `limactl
# snapshot` is QEMU-only, so this VM has no snapshots. Accepted — see README.
vmType: vz

# Rosetta binfmt so x86-only Docker images still run. This M2 has no nested
# virtualisation (M3+ only), but that only matters for a *macOS* guest; Linux
# containers inside a Linux guest are not nested virt and run natively.
rosetta:
  enabled: true
  binfmt: true

# The host is genuinely thin now — Gateway's thin client and a browser — while
# the VM runs the agent, the builds AND a full WebStorm backend. JetBrains asks
# for 2+ cores and 4GB+ for the backend alone, on top of whatever the build
# needs, so this is up from the 4/12 of the mounted-folder design.
# This is the one knob to turn if things feel tight.
cpus: 6           # of 8
memory: 14GiB     # of 24 — leaves 10GB for macOS and the thin client
# Measured, not guessed. Tracked source plus git history is small — well under
# 1GB across every project. The budget:
#
#   Ubuntu base + apt (2 JDKs ~700MB, Docker, build-essential, X libs)  ~3GB
#   Node + pnpm + OpenSpec                                            ~0.3GB
#   pnpm store                                                        ~4.5GB
#   node_modules incremental over the store                           ~1.5GB
#   Playwright + Chromium                                               ~1GB
#   Supabase Docker images                                              ~4GB
#   WebStorm backend + indexes                                          ~4GB
#   source, .git, build output                                        ~1.5GB
#   ----------------------------------------------------------------------
#   realistic peak                                                     ~20GB
#
# node_modules is cheap because pnpm hardlinks into the store on ext4, so those
# trees are mostly the same inodes as the store rather than copies of it. Note
# the exception: repos on npm or yarn write flat duplicated trees with no
# dedup, and they are what the 1.5GB above is mostly for.
#
# Sparse, so this is a ceiling and not a reservation — but not therefore free.
# The image grows and never shrinks when files are deleted inside the guest, so
# it only ratchets up. A ceiling above the host's free space lets a runaway
# build fill the macOS boot volume. 60GiB is 3x the realistic peak; keep it well
# inside the host's free space.
# Growing a Lima disk later is supported; shrinking is not. Start small.
disk: 60GiB

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64

# --- Isolation ----------------------------------------------------------------
# NO host mounts. Everything — code, node_modules, the IDE backend — lives on
# the VM's local disk; WebStorm attaches over SSH via JetBrains Gateway with
# only the thin client on the Mac.
#
# This was briefly a writable mount of ~/projects/current so host-native
# WebStorm could see the code. The problem that killed it: node_modules would
# be shared, so native binaries (esbuild, rollup, sharp) belonged to whichever
# OS installed last — exactly what the dev containers' per-project
# node_modules volumes existed to prevent. The alternative, keeping
# node_modules VM-local, left WebStorm unable to resolve an import.
#
# Moving the IDE to the same side of the boundary as the code dissolves that
# instead of trading around it: one filesystem, one Node, one set of binaries,
# nothing to keep in sync. JetBrains also states that network filesystems are
# unsupported for the backend and that it wants local disk, so a shared folder
# was working against the IDE as well.
mounts: []
mountType: virtiofs   # only relevant if a mount is ever added; kept explicit

ssh:
  # Don't copy host ~/.ssh/*.pub into the guest. Public keys are harmless, but
  # the VM has its own key for GitHub (see setup-github.sh) and access is via
  # Lima's generated key, so there is no reason to link the two identities.
  loadDotSSHPubKeys: false

# Lima ships containerd/nerdctl by default. We install Docker Engine instead
# (below), so leaving these on would waste several GB for nothing.
containerd:
  system: false
  user: false

# --- Ports --------------------------------------------------------------------
# Lima forwards guest ports bound to 0.0.0.0 automatically. Ports bound to
# 127.0.0.1 *inside* the guest are invisible unless declared here.
#
# Preferred fix is still to bind 0.0.0.0 in the app (Vite: `server.host: true`),
# which needs no entry below. These rules are belt-and-braces for tools that
# hardcode localhost — notably the Supabase CLI.
#   5173 vite dev · 4173 vite preview · 5174 e2e's own vite dev
#   54321 supabase api · 54322 db · 54323 studio · 54324 mailpit
#   5901 x11vnc for display :99 — localhost-only by design, so it must be here
#   9000 sonarqube — published on 127.0.0.1 only, same reasoning
#   5432 postgres (the dev database, not Supabase's) — same again
portForwards:
  - guestIP: "127.0.0.1"
    guestPortRange: [5432, 5432]
    hostIP: "127.0.0.1"
    hostPortRange: [5432, 5432]
  - guestIP: "127.0.0.1"
    guestPortRange: [9000, 9000]
    hostIP: "127.0.0.1"
    hostPortRange: [9000, 9000]
  - guestIP: "127.0.0.1"
    guestPortRange: [5901, 5901]
    hostIP: "127.0.0.1"
    hostPortRange: [5901, 5901]
  - guestIP: "127.0.0.1"
    guestPortRange: [5173, 5175]
    hostIP: "127.0.0.1"
    hostPortRange: [5173, 5175]
  - guestIP: "127.0.0.1"
    guestPortRange: [4173, 4173]
    hostIP: "127.0.0.1"
    hostPortRange: [4173, 4173]
  - guestIP: "127.0.0.1"
    guestPortRange: [54321, 54324]
    hostIP: "127.0.0.1"
    hostPortRange: [54321, 54324]

# --- Pinned versions ----------------------------------------------------------
# One set for every project. Bumping these bumps every project at once; that is
# the point, and it is also the risk. Bump deliberately.
#
# `param:`, NOT `env:`. They look interchangeable and are not: `env:` sets the
# guest's LOGIN environment, and provision scripts never see it — under
# `set -u` every reference below would abort the provision as an unbound
# variable. `param:` is the one that reaches provision scripts and probes,
# exposed there as $PARAM_<Key>.
#
# Renovate bumps every value with a `# renovate:` line directly above it (see
# renovate.json). Keep that line adjacent to its value, or Renovate stops
# matching it and the pin goes quiet rather than failing.
param:
  # renovate: datasource=node-version depName=node
  NODE_VERSION: "26.7.0"
  # renovate: datasource=npm depName=pnpm
  PNPM_VERSION: "12.14.0"
  # renovate: datasource=npm depName=@fission-ai/openspec
  OPENSPEC_VERSION: "1.14.3"
  # renovate: datasource=github-releases depName=supabase/cli extractVersion=^v(?<version>.*)$
  SUPABASE_CLI_VERSION: "2.115.0"
  # The `skills` CLI (npx skills add ...) that installs Claude Code skills.
  # renovate: datasource=npm depName=skills
  SKILLS_CLI_VERSION: "1.8.0"
  # SonarQube Community Build (container) and the scanner that feeds it.
  # renovate: datasource=docker depName=sonarqube
  SONARQUBE_VERSION: "26.9.0.129388-community"
  # renovate: datasource=github-releases depName=SonarSource/sonar-scanner-cli
  SONAR_SCANNER_VERSION: "8.2.0.6438"
  # MkDocs with the Material theme, for docs sites such as project-setup's.
  # renovate: datasource=pypi depName=mkdocs-material
  MKDOCS_MATERIAL_VERSION: "9.7.7"
  # Hugo (extended, for themes that compile SCSS), for pauls-blog. Kept equal
  # to HUGO_VERSION in pauls-blog's .github/workflows/hugo.yml, so a local
  # build matches the deploy. Bump the two together.
  # renovate: datasource=github-releases depName=gohugoio/hugo extractVersion=^v(?<version>.*)$
  HUGO_VERSION: "0.169.0"
  # The dev database (container), and the major of the psql client too. A
  # major bump needs a rebuild: Postgres data directories do not carry across
  # majors without a dump and restore.
  # renovate: datasource=docker depName=postgres
  POSTGRES_VERSION: "18.6"
  # JVM versions come from SDKMAN, not apt — the same division as Node, where
  # fnm owns every version and apt owns none. SDKMAN identifiers, so a bump
  # means editing these two lines — by hand: Renovate has no SDKMAN datasource.
  #
  # Java is the one place "one version for everything" doesn't hold: Gradle
  # toolchains are a declared per-project requirement, not a preference. A
  # project that pins jvmToolchain(21), with only 25 installed, makes
  # Gradle either auto-provision mid-build or fail. Gradle discovers both
  # from SDKMAN's candidates directory, so no auto-provisioning happens.
  JAVA_VERSIONS: "25.0.4-tem 21.0.12-tem"
  JAVA_DEFAULT: "25.0.4-tem"

provision:
  # ---------------------------------------------------------------------------
  # SYSTEM: root-owned packages.
  # ---------------------------------------------------------------------------
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail

      export DEBIAN_FRONTEND=noninteractive

      # The login user is NOT uid 1000: Lima carries the host's uid into the
      # guest (501 on macOS), and the home directory is <name>.guest. Lima 2.x
      # also warns against referencing LIMA_CIDATA_*, so identify the user by
      # scanning /etc/passwd for the first non-system account under /home.
      # Defined first because Docker, /etc/environment and the VNC display
      # below all need it, and under `set -u` a missing definition aborts.
      LOGIN_USER="$(awk -F: '$3>=500 && $3<65000 && $6 ~ /^\/home\// {print $1; exit}' /etc/passwd)"
      LOGIN_HOME="$(getent passwd "$LOGIN_USER" | cut -d: -f6)"
      [ -n "$LOGIN_USER" ] && [ -d "$LOGIN_HOME" ] \
        || { echo "could not identify the login user" >&2; exit 1; }

      apt-get update

      # python3-venv: project-local virtualenvs (e.g. docs/explainer/tts uses
      # one for Piper). Ubuntu's python3 ships without ensurepip.
      # pipx: Python CLIs (mkdocs) in their own venvs, since Ubuntu's python3
      # refuses a global `pip install` (PEP 668).
      # asciidoctor + ruby-rouge: pauls-blog's .adoc posts, which Hugo renders
      # by running asciidoctor (rouge is their `:source-highlighter:`).
      # ruby-asciidoctor-pdf: its CV's generate-pdf.sh.
      apt-get install -y --no-install-recommends \
        ca-certificates curl git gnupg zip unzip zsh ripgrep jq less \
        build-essential python3-venv pipx \
        asciidoctor ruby-rouge ruby-asciidoctor-pdf

      # --- Postgres client ----------------------------------------------------
      # psql is how the migration scripts run raw SQL against the shared
      # Supabase instance (the Supabase CLI's own migration up/db push stop
      # working once a database is shared across apps' migration histories),
      # and how agents query the dev database below.
      # From the PostgreSQL project's apt repo, not Ubuntu's: noble ships 16,
      # and a client older than the server is the broken direction — pg_dump
      # refuses a newer server outright. A newer client handles every older
      # server, Supabase's included. Major taken from POSTGRES_VERSION, so the
      # client and the dev database move together.
      install -d -m 755 /etc/apt/keyrings
      curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
        | gpg --batch --yes --dearmor -o /etc/apt/keyrings/pgdg.gpg
      echo "deb [arch=arm64 signed-by=/etc/apt/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
        > /etc/apt/sources.list.d/pgdg.list
      apt-get update
      apt-get install -y --no-install-recommends "postgresql-client-${PARAM_POSTGRES_VERSION%%.*}"

      # --- Electron -----------------------------------------------------------
      # Electron apps run their unit tests INSIDE Electron, plus Playwright e2e
      # against a packaged build — so Electron has to launch here, not merely
      # compile.
      #   xvfb      : a virtual display; there is no real one in this VM
      #   fakeroot  : electron-builder needs it for Linux (deb) targets
      # Playwright's own --with-deps covers some of these, but only some, and
      # it is a best-effort step — do not rely on it for Electron.
      apt-get install -y --no-install-recommends \
        libgtk-3-0t64 libnotify4 libnss3 libxss1 libxtst6 xdg-utils \
        libatspi2.0-0t64 libdrm2 libgbm1 libasound2t64 libcups2t64 \
        libpango-1.0-0 libcairo2 libx11-xcb1 libxcomposite1 libxdamage1 \
        libxrandr2 libxkbcommon0 xvfb fakeroot

      # Ubuntu 23.10+ restricts unprivileged user namespaces through AppArmor,
      # which breaks Chromium's and Electron's sandbox: the launch aborts with
      # "The SUID sandbox helper binary was found, but is not configured
      # correctly ... chrome-sandbox is owned by root and has mode 4755".
      #
      # Allowing unprivileged userns fixes it with the sandbox left ON. The
      # alternatives are worse: --no-sandbox disables a real security boundary,
      # and chown/chmod of chrome-sandbox has to be redone after every
      # node_modules install. Guarded, since the knob only exists on 23.10+.
      if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
        echo 'kernel.apparmor_restrict_unprivileged_userns = 0' \
          > /etc/sysctl.d/61-electron-userns.conf
        sysctl -p /etc/sysctl.d/61-electron-userns.conf
      fi

      # --- A display you can look at ------------------------------------------
      # xvfb-run gives tests a throwaway display nobody can see. To actually
      # watch an Electron app, a persistent Xvfb runs on :99 and x11vnc serves
      # it; macOS Screen Sharing connects via vnc://localhost:5901.
      #   :99   : clear of xvfb-run -a, which counts up from :99 only if taken
      #           — it is, so test runs land on :100+ and never on this screen
      #   5901  : not 5900, which the Mac's own Screen Sharing server owns
      #   -localhost : reachable only through Lima's forward (see portForwards)
      # DISPLAY is deliberately NOT set machine-wide: with DISPLAY set and no
      # tty, ssh (so git over ssh) reaches for an X askpass helper. Opt in per
      # command with DISPLAY=:99.
      #
      # No window manager, so windows have no title bars and cannot be moved;
      # fine for looking at one app. The password is a random 8 characters
      # (the VNC limit) in ~/.vnc/password.txt — it is Screen Sharing that
      # insists on one, and -localhost is the real boundary.
      apt-get install -y --no-install-recommends x11vnc
      vnc_dir="$LOGIN_HOME/.vnc"
      if [ ! -s "$vnc_dir/passwd" ]; then
        install -d -m 0700 -o "$LOGIN_USER" -g "$LOGIN_USER" "$vnc_dir"
        pw="$(head -c 64 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 8)"
        printf '%s\n' "$pw" > "$vnc_dir/password.txt"
        x11vnc -storepasswd "$pw" "$vnc_dir/passwd"
        chown "$LOGIN_USER:$LOGIN_USER" "$vnc_dir/password.txt" "$vnc_dir/passwd"
        chmod 0600 "$vnc_dir/password.txt" "$vnc_dir/passwd"
      fi
      printf '%s\n' \
        "SET client_min_messages = warning;" \
        '[Unit]' \
        'Description=Persistent X display :99 for viewing GUI apps' \
        '[Service]' \
        "User=$LOGIN_USER" \
        'ExecStart=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp' \
        'Restart=on-failure' \
        '[Install]' \
        'WantedBy=multi-user.target' \
        > /etc/systemd/system/devvm-display.service
      printf '%s\n' \
        "SET client_min_messages = warning;" \
        '[Unit]' \
        'Description=VNC server for display :99' \
        'BindsTo=devvm-display.service' \
        'After=devvm-display.service' \
        '[Service]' \
        "User=$LOGIN_USER" \
        "ExecStart=/usr/bin/x11vnc -display :99 -rfbport 5901 -localhost -noipv6 -rfbportv6 -1 -forever -shared -rfbauth $vnc_dir/passwd" \
        'Restart=on-failure' \
        'RestartSec=2' \
        '[Install]' \
        'WantedBy=multi-user.target' \
        > /etc/systemd/system/devvm-vnc.service
      systemctl daemon-reload
      systemctl enable --now devvm-display.service devvm-vnc.service

      # --- JetBrains remote backend prerequisites -----------------------------
      # Gateway downloads and runs the WebStorm backend itself (into
      # ~/.cache/JetBrains), so there is nothing to install for the IDE as
      # such. Two things it does need from the OS:
      #
      # 1. A handful of X/font libraries. JetBrains' own docs say the backend
      #    is self-contained and needs no extra dependencies, but their Alpine
      #    requirements list these explicitly and headless Debian images are
      #    routinely missing them. ~20MB of insurance against a backend that
      #    starts and then dies on a missing libXext.
      apt-get install -y --no-install-recommends \
        libxext6 libxrender1 libxtst6 libxi6 libfreetype6 fontconfig procps

      # 2. More inotify watches. The default is far too low for an IDE indexing
      #    forty repos; past the limit the IntelliJ platform silently gives up
      #    on file watching and falls back to recursive directory scans, which
      #    is the "why is my IDE constantly re-scanning" symptom. 524288 is
      #    JetBrains' own recommendation.
      # printf, not a heredoc: a heredoc body and terminator have to sit at
      # column 0, which inside this YAML block scalar is impossible — the
      # terminator ends up indented, bash never recognises it, and the rest of
      # the script gets swallowed into the file. `bash -n` does NOT catch it.
      printf 'fs.inotify.max_user_watches = %s\nfs.inotify.max_user_instances = %s\n' \
        524288 512 > /etc/sysctl.d/60-jetbrains-inotify.conf
      sysctl -p /etc/sysctl.d/60-jetbrains-inotify.conf

      # GONE: Eclipse Temurin from the Adoptium apt repo, and with it the
      # `jdkDistro: tem` devcontainer-Feature workaround. JVM versions are
      # SDKMAN's job now (user provision step below) — `zip` above is its one
      # extra dependency, and omitting it is what made the first attempt fail.

      # --- Docker Engine, native ---------------------------------------------
      # Not Docker Desktop: no licence question, no 47GB VM-inside-a-VM, and
      # containers run directly on this kernel. This is where
      # the local Supabase stack runs.
      # --batch --yes: on a re-provision the keyring already exists, and without
      # them gpg asks to overwrite it on a TTY provision doesn't have — which
      # aborts this whole script under `set -e`.
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
        | gpg --batch --yes --dearmor -o /etc/apt/keyrings/docker.gpg
      echo "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
        > /etc/apt/sources.list.d/docker.list

      apt-get update

      apt-get install -y --no-install-recommends \
        docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      usermod -aG docker "$LOGIN_USER"
      systemctl enable --now docker

      # --- SonarQube Community Build ------------------------------------------
      # Code-quality gate for every repo, scanned with `sonar-check` (below).
      # Its embedded Elasticsearch refuses to start below this map count.
      printf 'vm.max_map_count = %s\n' 524288 > /etc/sysctl.d/62-sonarqube.conf
      sysctl -p /etc/sysctl.d/62-sonarqube.conf
      # Created once; `unless-stopped` brings it back at boot, and leaves it
      # down after a `docker stop sonarqube`.
      # shortcut: embedded H2 database, which SonarQube cannot upgrade in place —
      # fine while a version bump means a VM rebuild; move to Postgres if not.
      docker inspect sonarqube > /dev/null 2>&1 \
        || docker run -d --name sonarqube --restart unless-stopped \
          -p 127.0.0.1:9000:9000 \
          -v sonarqube_data:/opt/sonarqube/data \
          -v sonarqube_extensions:/opt/sonarqube/extensions \
          -v sonarqube_logs:/opt/sonarqube/logs \
          "sonarqube:${PARAM_SONARQUBE_VERSION}"

      # Scanner CLI, with its own bundled JRE so it ignores SDKMAN's java.
      scanner="/opt/sonar-scanner-${PARAM_SONAR_SCANNER_VERSION}-linux-aarch64"
      if [ ! -x "$scanner/bin/sonar-scanner" ]; then
        tmp="$(mktemp -d)"
        curl -fsSL -o "$tmp/scanner.zip" \
          "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${PARAM_SONAR_SCANNER_VERSION}-linux-aarch64.zip"
        unzip -q "$tmp/scanner.zip" -d /opt
        rm -rf "$tmp"
      fi
      ln -sfn "$scanner/bin/sonar-scanner" /usr/local/bin/sonar-scanner

      # --- Postgres: the dev database -----------------------------------------
      # A local database agents can query while they code, separate from the
      # Supabase stack (54322). Two login roles, so exploring cannot change
      # anything:
      #   dev_ro  reads every table in every database (pg_read_all_data), and
      #           its sessions start read-only on top of that
      #   dev_rw  owns the `dev` database and may create more; run migrations
      #           as this one
      # Passwords are generated once and kept in /etc/devdb (root only). Every
      # boot re-applies them, the roles and the grants, so a re-provision and a
      # fresh volume both end in the same state.
      install -d -m 700 /etc/devdb
      for role in postgres dev_ro dev_rw; do
        [ -s "/etc/devdb/$role" ] || (umask 077; openssl rand -hex 24 > "/etc/devdb/$role")
      done
      # The volume is mounted at /var/lib/postgresql, not .../data: from 18 on
      # the image keeps its data in a per-major subdirectory there.
      docker inspect postgres > /dev/null 2>&1 \
        || docker run -d --name postgres --restart unless-stopped \
          -p 127.0.0.1:5432:5432 \
          -e POSTGRES_PASSWORD="$(cat /etc/devdb/postgres)" \
          -v postgres_data:/var/lib/postgresql \
          "postgres:${PARAM_POSTGRES_VERSION}"
      docker start postgres > /dev/null
      # Wait over TCP, not the socket: on first start the image runs a
      # socket-only server to initialise, then restarts. Statements sent to
      # that one would be cut off by the restart.
      timeout 120s bash -c 'until docker exec postgres pg_isready -q -h 127.0.0.1 -U postgres; do sleep 2; done'
      # Through stdin, not -c: psql expands :'var' only in input it reads.
      printf '%s\n' \
        "SET client_min_messages = warning;" \
        "SELECT 'CREATE ROLE dev_rw' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'dev_rw') \\gexec" \
        "SELECT 'CREATE ROLE dev_ro' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'dev_ro') \\gexec" \
        "ALTER ROLE dev_rw LOGIN CREATEDB PASSWORD :'rw_pw';" \
        "ALTER ROLE dev_ro LOGIN PASSWORD :'ro_pw';" \
        "ALTER ROLE dev_ro SET default_transaction_read_only = on;" \
        "GRANT pg_read_all_data TO dev_ro;" \
        "SELECT 'CREATE DATABASE dev OWNER dev_rw' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'dev') \\gexec" \
        | docker exec -i postgres psql -q -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -v rw_pw="$(cat /etc/devdb/dev_rw)" -v ro_pw="$(cat /etc/devdb/dev_ro)"
      # `psql service=dev_ro` / `service=dev_rw`. Ubuntu's libpq reads services
      # from here; passwords go in ~/.pgpass, which is the user's own file, so
      # only this database's two lines are replaced.
      install -d /etc/postgresql-common
      printf '[%s]\nhost=localhost\nport=5432\ndbname=dev\nuser=%s\n\n' \
        dev_ro dev_ro dev_rw dev_rw > /etc/postgresql-common/pg_service.conf
      pgpass="$LOGIN_HOME/.pgpass"
      touch "$pgpass"
      sed -i '/^localhost:5432:\*:dev_r[ow]:/d' "$pgpass"
      for role in dev_ro dev_rw; do
        printf 'localhost:5432:*:%s:%s\n' "$role" "$(cat "/etc/devdb/$role")" >> "$pgpass"
      done
      chown "$LOGIN_USER:" "$pgpass"
      chmod 600 "$pgpass"

      # --- JAVA_HOME / PATH for non-interactive shells ------------------------
      # Points at SDKMAN's `current` symlink, so `sdk default java <v>` moves
      # the machine default for scripts too — one place to change it.
      #
      # The java entry goes LAST in PATH, deliberately. sdkman-init prepends
      # its own candidates entry in interactive shells and `sdk use` / `sdk env`
      # rewrites that one; a java entry ahead of it wins and silently breaks
      # per-project switching (observed: `sdk env` reported 21 while `java
      # -version` still said 25). At the tail it only serves non-interactive
      # shells, which have no sdk function anyway.
      echo "JAVA_HOME=\"$LOGIN_HOME/.sdkman/candidates/java/current\"" >> /etc/environment
      printf 'PATH="%s/.fnm/aliases/default/bin:%s/.local/share/pnpm/bin:%s/.fnm:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:%s/.sdkman/candidates/java/current/bin"\n' \
        "$LOGIN_HOME" "$LOGIN_HOME" "$LOGIN_HOME" "$LOGIN_HOME" >> /etc/environment

      # --- Supabase CLI -------------------------------------------------------
      # Static binary, not a global npm install (which Supabase deprecates).
      # Ported from post-create.sh step 3, but installed ONCE for the machine
      # instead of once per container.
      if [ "$(supabase --version 2>/dev/null || echo none)" != "${PARAM_SUPABASE_CLI_VERSION}" ]; then
        tmp="$(mktemp -d)"
        curl -fsSL -o "$tmp/supabase.tar.gz" \
          "https://github.com/supabase/cli/releases/download/v${PARAM_SUPABASE_CLI_VERSION}/supabase_${PARAM_SUPABASE_CLI_VERSION}_linux_arm64.tar.gz"
        tar -xzf "$tmp/supabase.tar.gz" -C "$tmp" supabase
        install -m 0755 "$tmp/supabase" /usr/local/bin/supabase
        rm -rf "$tmp"
      fi

      apt-get clean && rm -rf /var/lib/apt/lists/*

      # Counteract the sparse-image ratchet where the stack allows it: fstrim
      # tells the host which blocks are free again. Ubuntu enables this timer
      # by default; making it explicit because it matters more here than usual.
      # Whether the freed blocks are actually reclaimed depends on discard
      # support through virtio-blk under vz, so treat it as a best effort and
      # watch `ls -lks ~/.lima/dev/diffdisk` on the host if the image creeps.
      systemctl enable fstrim.timer || true

  # ---------------------------------------------------------------------------
  # DATA: `sonar-check`, the one command a repo's Verify step calls. Scans the
  # repo it is run in, creating the SonarQube project on the first scan, and
  # exits non-zero when the quality gate fails, after printing why — the
  # scanner itself prints only a dashboard URL an agent cannot open.
  # A file, not a script step, so it needs no heredoc (see the inotify note).
  # ---------------------------------------------------------------------------
  - mode: data
    path: /usr/local/bin/sonar-check
    permissions: 755
    content: |
      #!/bin/bash
      # Usage: sonar-check [-Dsonar.<prop>=<value> ...]   (devvm README, SonarQube)
      set -euo pipefail
      host=http://localhost:9000
      token_file="$HOME/.config/sonar/token"
      if [ ! -s "$token_file" ]; then
        echo "sonar-check: no token in $token_file — see the SonarQube section of the devvm README." >&2
        exit 2
      fi
      if ! curl -fsS "$host/api/system/status" | grep -q '"status":"UP"'; then
        echo "sonar-check: SonarQube is not up at $host. Try: docker start sonarqube" >&2
        exit 2
      fi
      token="$(cat "$token_file")"
      root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
      # A key in sonar-project.properties wins; otherwise the repo's directory name.
      key="$(sed -n 's/^sonar\.projectKey=//p' "$root/sonar-project.properties" 2>/dev/null || true)"
      key="${key:-$(basename "$root")}"

      status=0
      (cd "$root" && SONAR_TOKEN="$token" SONAR_HOST_URL="$host" \
        sonar-scanner -Dsonar.projectKey="$key" -Dsonar.qualitygate.wait=true "$@") || status=$?

      if [ "$status" -ne 0 ]; then
        echo
        echo "=== sonar-check: FAILED for $key ($host/dashboard?id=$key) ==="
        echo "--- failed quality gate conditions ---"
        curl -fsSu "$token:" "$host/api/qualitygates/project_status?projectKey=$key" \
          | jq -r '.projectStatus.conditions[]? | select(.status == "ERROR")
                   | "\(.metricKey): \(.actualValue) (fails when \(.comparator) \(.errorThreshold))"' || true
        echo "--- open issues in new code (file:line rule message) ---"
        curl -fsSu "$token:" "$host/api/issues/search?components=$key&resolved=false&inNewCodePeriod=true&ps=100" \
          | jq -r '.issues[] | "\(.component | sub("^[^:]*:"; "")):\(.line // "-")  \(.rule)  \(.message)"' || true
      else
        echo "=== sonar-check: quality gate passed for $key ==="
      fi
      exit "$status"

  # ---------------------------------------------------------------------------
  # SYSTEM: Hugo extended, for pauls-blog. The upstream .deb, not Ubuntu's
  # package, which lags far behind and is not the extended build. Reinstalled
  # only when the pinned version changes. Own step and best-effort, so a
  # failed download cannot take the rest of the boot with it.
  # ---------------------------------------------------------------------------
  - mode: system
    script: |
      #!/bin/bash
      set -uo pipefail
      if ! hugo version 2>/dev/null | grep -q "v${PARAM_HUGO_VERSION}-.*+extended"; then
        tmp="$(mktemp -d)"
        curl -fsSL -o "$tmp/hugo.deb" \
          "https://github.com/gohugoio/hugo/releases/download/v${PARAM_HUGO_VERSION}/hugo_extended_${PARAM_HUGO_VERSION}_linux-arm64.deb" \
          && dpkg -i "$tmp/hugo.deb" \
          || echo "! hugo skipped — re-run ./update-vm.sh later"
        rm -rf "$tmp"
      fi

  # ---------------------------------------------------------------------------
  # USER: the JS toolchain, owned by the login user.
  #
  # GONE, all of it, from post-create.sh:
  #   step 1  volume ownership chowns  — no named volumes, no root-owned mounts
  #   step 1b ~/.claude.json migration — no CLAUDE_CONFIG_DIR; ~/.claude is just
  #           a directory in a home directory that persists because it is a VM
  #   step 4  pnpm store-dir + the XDG_CONFIG_HOME/JetBrains double-write — the
  #           default store at ~/.local/share/pnpm/store is already shared by
  #           every project on this machine, which is all /cache ever wanted
  #   step 5  per-repo pnpm install — belongs to the repo, not the environment
  # ---------------------------------------------------------------------------
  - mode: user
    script: |
      #!/bin/bash
      set -euo pipefail

      export FNM_DIR="$HOME/.fnm"
      export PNPM_HOME="$HOME/.local/share/pnpm"
      export PATH="$FNM_DIR:$PNPM_HOME/bin:$PATH"

      # --- fnm + one Node -----------------------------------------------------
      # fnm installs one default Node for every project, and interactive shells
      # get --use-on-cd so a repo's .node-version / .nvmrc pin still wins
      # inside that repo (see the shell wiring below).
      if [ ! -x "$FNM_DIR/fnm" ]; then
        curl -fsSL https://fnm.vercel.app/install | bash -s -- --install-dir "$FNM_DIR" --skip-shell
      fi
      "$FNM_DIR/fnm" install "${PARAM_NODE_VERSION}"
      "$FNM_DIR/fnm" default "${PARAM_NODE_VERSION}"

      # Put node/npm on PATH via the default-alias directory rather than
      # `eval "$(fnm env)"`. fnm infers the shell from its parent process, and
      # in a provision script there is nothing to infer from: it fails with
      # "Can't infer shell!", the eval expands to nothing, and the next line
      # that needs npm dies under `set -e` — which is exactly how the first
      # build of this VM failed. The alias dir is a plain path and always
      # correct. (The original Dockerfile did the same thing with ENV PATH.)
      export PATH="$FNM_DIR/aliases/default/bin:$PNPM_HOME/bin:$FNM_DIR:$PATH"

      # --- pnpm, standalone ---------------------------------------------------
      # Self-contained, not tied to a Node install, so an fnm patch bump won't
      # lose it. pnpm v10+ self-manages each repo's `packageManager` field, so
      # this single binary transparently serves repos still pinned anywhere from
      # 11.5.2 to 12.4.2 — the pins can be normalised later, at leisure.
      if [ "$(pnpm --version 2>/dev/null || echo none)" != "${PARAM_PNPM_VERSION}" ]; then
        curl -fsSL https://get.pnpm.io/install.sh \
          | env PNPM_VERSION="${PARAM_PNPM_VERSION}" SHELL=/bin/bash sh -
      fi

      # --- OpenSpec CLI -------------------------------------------------------
      # npm, not pnpm: drops the binary into the fnm Node's bin, already on PATH.
      # A machine dev tool, not an app dependency. Use the SCOPED package — the
      # bare `openspec` on npm is an empty placeholder.
      npm install -g "@fission-ai/openspec@${PARAM_OPENSPEC_VERSION}"

      # --- Shell wiring -------------------------------------------------------
      # bash AND zsh, same as the Dockerfile did. Built with echo rather than a
      # heredoc on purpose: a heredoc body has to sit at column 0, which would
      # terminate this YAML block scalar early.
      #
      # NOT written here, deliberately:
      #   PLAYWRIGHT_BROWSERS_PATH / PLAYWRIGHT_SKIP_BROWSER_GC
      #     The shared browser volume needed both. Playwright's .links files
      #     hold absolute paths into a per-project node_modules volume that
      #     sibling containers could not see, so each container decided the
      #     others' browsers were orphans and garbage-collected them. One
      #     filesystem, all node_modules mutually visible: the paths resolve,
      #     validation passes, nothing is collected. Default location is fine.
      #   CLAUDE_CONFIG_DIR, GH_CONFIG_DIR
      #     Both existed to drag credentials onto a mounted volume. ~/.claude
      #     and ~/.config/gh are now just directories in a home directory that
      #     persists, which is what they always assumed they were.
      for shell in bash zsh; do
        rc="$HOME/.${shell}rc"
        touch "$rc"
        if ! grep -q 'dev vm toolchain' "$rc"; then
          {
            echo ''
            echo '# --- dev vm toolchain ---'
            echo 'export FNM_DIR="$HOME/.fnm"'
            echo 'export PNPM_HOME="$HOME/.local/share/pnpm"'
            echo 'export PATH="$FNM_DIR:$PNPM_HOME/bin:$PATH"'
            echo "eval \"\$(fnm env --use-on-cd --shell ${shell})\""
            echo 'export OPENSPEC_TELEMETRY=0'
            echo ''
            echo '# Layer 4 of the pnpm guard, and the only one that fires before'
            echo '# anything is written. The repo-level guards are a preinstall hook'
            echo '# (bypassed by --ignore-scripts), .gitignore, and a CI check — all of'
            echo '# which catch the mistake after the fact. This catches it first.'
            echo '# Scoped to install-type commands and only where a pnpm lockfile is'
            echo '# present, so `npm install -g` and the genuinely-npm repos still work.'
            echo 'npm() { case "$1" in install|i|ci|add|update) if [ -f pnpm-lock.yaml ]; then printf "%s\n" "pnpm-lock.yaml present - use pnpm, not npm" >&2; return 1; fi ;; esac; command npm "$@"; }'
          } >> "$rc"
        fi
        # rc files written before --use-on-cd was added skip the block above; upgrade them in place.
        sed -i 's/fnm env --shell/fnm env --use-on-cd --shell/' "$rc"
      done

      # Where the repos get cloned. Mirrors the host layout out of habit, so
      # paths read the same in notes and commit messages.
      mkdir -p "$HOME/projects/current"

  # ---------------------------------------------------------------------------
  # USER: SDKMAN + the JVM versions. Separate step so a slow JDK download
  # cannot take the JS toolchain down with it.
  # ---------------------------------------------------------------------------
  - mode: user
    script: |
      #!/bin/bash
      set -euo pipefail

      export SDKMAN_DIR="$HOME/.sdkman"

      # rcupdate=false: the installer would otherwise append its own init to
      # the rc files, and the shell wiring is written in one place below.
      if [ ! -s "$SDKMAN_DIR/bin/sdkman-init.sh" ]; then
        curl -fsSL "https://get.sdkman.io?rcupdate=false" | bash
      fi

      # sdkman-init trips `set -u`, so relax it just for the source.
      set +u
      source "$SDKMAN_DIR/bin/sdkman-init.sh"
      set -u

      # Non-interactive: answer the "set as default?" prompt from stdin.
      for v in ${PARAM_JAVA_VERSIONS}; do
        if [ ! -d "$SDKMAN_DIR/candidates/java/$v" ]; then
          sdk install java "$v" < /dev/null
        fi
      done
      # Explicit, because SDKMAN makes the FIRST install its default — which
      # would leave interactive shells on 21 while /etc/environment pointed
      # non-interactive ones at 25.
      sdk default java "${PARAM_JAVA_DEFAULT}" < /dev/null

      # `cd` into a directory holding .sdkmanrc switches the JDK. Interactive
      # shells only — it hooks PROMPT_COMMAND, so scripts never see it. For
      # non-interactive correctness Gradle toolchains are the mechanism, and
      # they find every version above in SDKMAN's candidates directory.
      sed -i 's/^sdkman_auto_env=false/sdkman_auto_env=true/' "$SDKMAN_DIR/etc/config"

      for shell in bash zsh; do
        rc="$HOME/.${shell}rc"
        touch "$rc"
        grep -q 'sdkman-init' "$rc" && continue
        {
          echo ''
          echo '# --- sdkman (JVM versions) ---'
          echo '# Last on purpose: sdkman-init prepends its candidates to PATH.'
          echo 'export SDKMAN_DIR="$HOME/.sdkman"'
          echo '[ -s "$SDKMAN_DIR/bin/sdkman-init.sh" ] && source "$SDKMAN_DIR/bin/sdkman-init.sh"'
        } >> "$rc"
      done

  # ---------------------------------------------------------------------------
  # USER: Playwright browsers. Separate step so a flaky download can't take the
  # toolchain down with it — best-effort, same as post-create.sh step 6.
  # ---------------------------------------------------------------------------
  - mode: user
    script: |
      #!/bin/bash
      set -uo pipefail
      export FNM_DIR="$HOME/.fnm"
      # Deterministic path, not `eval "$(fnm env)"` — see the note in the
      # toolchain step. This step failed the first build for exactly that
      # reason: "npx: command not found", so no browsers were installed.
      export PATH="$FNM_DIR/aliases/default/bin:$HOME/.local/share/pnpm/bin:$FNM_DIR:$PATH"

      sudo env "PATH=$PATH" npx --yes playwright install-deps chromium \
        || echo "! playwright OS deps skipped"
      npx --yes playwright install chromium \
        || echo "! playwright chromium skipped — run 'npx playwright install chromium' later"

  # ---------------------------------------------------------------------------
  # USER: Claude Code skills, user-level, so every repo in the VM gets them.
  # Best-effort, like Playwright: a GitHub hiccup must not fail the provision.
  #
  # `-a claude-code` alone makes the CLI COPY into ~/.claude/skills rather than
  # symlink from ~/.agents/skills as it does on the host for multiple agents.
  # Only Claude Code runs here, so the copy is the simpler layout.
  # ---------------------------------------------------------------------------
  - mode: user
    script: |
      #!/bin/bash
      set -uo pipefail
      export FNM_DIR="$HOME/.fnm"
      # Deterministic path, not `eval "$(fnm env)"` — see the toolchain step.
      export PATH="$FNM_DIR/aliases/default/bin:$HOME/.local/share/pnpm/bin:$FNM_DIR:$PATH"

      # "<github owner/repo> <skill name>", one per line. Every skill in the
      # repo is installed; the name is only the "already there?" sentinel.
      skills='
      danyuchn/asd-ste100-skill asd-ste100
      mattpocock/skills setup-matt-pocock-skills
      prule/project-setup vssw-audit-project-compliance
      '
      echo "$skills" | while read -r repo name; do
        [ -n "$repo" ] || continue
        [ -f "$HOME/.claude/skills/$name/SKILL.md" ] && continue
        npx --yes "skills@${PARAM_SKILLS_CLI_VERSION}" add "$repo" -g -a claude-code -y < /dev/null \
          || echo "! skill $name skipped — run 'npx skills add $repo -g -a claude-code' later"
      done

  # ---------------------------------------------------------------------------
  # USER: MkDocs + Material, so a docs repo's `./run serve` / `./run build`
  # works (project-setup's `./run setup` does a global `pip install`, which
  # Ubuntu refuses). pipx gives it its own venv; --include-deps exposes the
  # `mkdocs` binary, which comes from a dependency, on ~/.local/bin.
  # Reinstalled only when the pinned version changes. Best-effort.
  # ---------------------------------------------------------------------------
  - mode: user
    script: |
      #!/bin/bash
      set -uo pipefail
      want="mkdocs-material ${PARAM_MKDOCS_MATERIAL_VERSION}"
      if [ "$(pipx list --short 2>/dev/null | grep '^mkdocs-material ')" != "$want" ]; then
        pipx install --force --include-deps "mkdocs-material==${PARAM_MKDOCS_MATERIAL_VERSION}" \
          || echo "! mkdocs skipped — run 'pipx install --include-deps mkdocs-material' later"
      fi

  # ---------------------------------------------------------------------------
  # USER: the `claude` CLI, for a shell in the VM (`ssh lima-dev`, Gateway's
  # terminal). The desktop app installs its own copy on first connect, but
  # under ~/.claude/remote/ccd-cli/<version>, which is not on PATH and changes
  # name with every update. This is the native installer: ~/.local/bin/claude,
  # self-updating, so it is not pinned in `param:` — the desktop app's copy
  # floats too, and the two stay roughly in step.
  #
  # Ubuntu's ~/.profile adds ~/.local/bin only if it existed at login, and it
  # did not on a fresh VM, so the rc files add it explicitly. Own marker, not
  # the toolchain block's, so an existing VM picks it up on its next boot.
  # Best-effort: a download failure must not fail the boot.
  # ---------------------------------------------------------------------------
  - mode: user
    script: |
      #!/bin/bash
      set -uo pipefail
      if [ ! -x "$HOME/.local/bin/claude" ]; then
        curl -fsSL https://claude.ai/install.sh | bash \
          || echo "! claude CLI skipped — run 'curl -fsSL https://claude.ai/install.sh | bash' later"
      fi

      for shell in bash zsh; do
        rc="$HOME/.${shell}rc"
        touch "$rc"
        grep -q 'claude cli' "$rc" && continue
        {
          echo ''
          echo '# --- claude cli ---'
          echo 'export PATH="$HOME/.local/bin:$PATH"'
        } >> "$rc"
      done

  # ---------------------------------------------------------------------------
  # USER: Claude Code plugins, user-level. First declare the marketplace and
  # enable the plugin in ~/.claude/settings.json, which needs no CLI. autoUpdate
  # makes Claude Code check the marketplace for a newer plugin version at each
  # start (off by default for third-party marketplaces). Merged with jq so
  # other settings survive. Enabling alone does NOT install a plugin: a
  # session does not install one that is enabled but missing.
  #
  # So when a CLI exists (~/.local/bin/claude, or the desktop app's
  # ~/.claude/remote/ccd-cli/<version>), each boot also adds a missing
  # marketplace, installs a missing plugin, and updates an installed one to
  # its latest version. The CLI step above is best-effort, so it may not.
  # Failures (no network, no GitHub key yet) do not fail the boot.
  # ---------------------------------------------------------------------------
  - mode: user
    script: |
      #!/bin/bash
      set -euo pipefail
      settings="$HOME/.claude/settings.json"
      mkdir -p "$HOME/.claude"
      [ -s "$settings" ] || echo '{}' > "$settings"

      # "<marketplace name> <github owner/repo> <plugin name>", one per line.
      plugins='
      sdlc-pipeline prule/sdlc-pipeline sdlc-pipeline
      ponytail DietrichGebert/ponytail ponytail
      '
      echo "$plugins" | while read -r market repo plugin; do
        [ -n "$market" ] || continue
        tmp="$(mktemp)"
        jq --arg m "$market" --arg r "$repo" --arg p "$plugin@$market" '
          .extraKnownMarketplaces[$m] = {source: {source: "github", repo: $r}, autoUpdate: true}
          | .enabledPlugins[$p] = true
        ' "$settings" > "$tmp" && mv "$tmp" "$settings"
      done

      claude="$(command -v claude || command -v "$HOME/.local/bin/claude" || ls -d "$HOME"/.claude/remote/ccd-cli/* 2>/dev/null | sort -V | tail -1 || true)"
      [ -n "$claude" ] || exit 0
      # A plugin added to the list above is in settings.json but not installed
      # yet, and `plugin update` fails on it ("Marketplace not found"), so add
      # and install whatever is missing first, then update.
      known="$HOME/.claude/plugins/known_marketplaces.json"
      installed="$HOME/.claude/plugins/installed_plugins.json"
      echo "$plugins" | while read -r market repo plugin; do
        [ -n "$market" ] || continue
        if ! jq -e --arg m "$market" 'has($m)' "$known" > /dev/null 2>&1; then
          timeout 180s "$claude" plugin marketplace add "$repo" < /dev/null \
            || { echo "! marketplace $market not added — run '$claude plugin marketplace add $repo' later"; continue; }
        fi
        if ! jq -e --arg p "$plugin@$market" '.plugins | has($p)' "$installed" > /dev/null 2>&1; then
          timeout 180s "$claude" plugin install "$plugin@$market" --scope user < /dev/null \
            || echo "! plugin $plugin not installed — run '$claude plugin install $plugin@$market' later"
          continue
        fi
        timeout 180s "$claude" plugin marketplace update "$market" < /dev/null \
          && timeout 180s "$claude" plugin update "$plugin@$market" --scope user < /dev/null \
          || echo "! plugin $plugin not updated — run '$claude plugin update $plugin@$market' later"
      done

# --- Readiness ----------------------------------------------------------------
probes:
  - description: "toolchain (node, pnpm, openspec, java, docker)"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      timeout 300s bash -c 'until [ -x "$HOME/.fnm/fnm" ]; do sleep 3; done'
      timeout 300s bash -c 'until command -v docker >/dev/null; do sleep 3; done'
      # Assert the DEFAULT jdk, not merely that some java exists: two JDKs are
      # installed and alternatives silently prefer the highest.
      # PARAM_JAVA_DEFAULT is an SDKMAN identifier (25.0.4-tem); java -version
      # prints 25.0.4, so compare the major only.
      timeout 600s bash -c 'until [ -s "$HOME/.sdkman/bin/sdkman-init.sh" ]; do sleep 5; done'
      java -version 2>&1 | grep -q "\"${PARAM_JAVA_DEFAULT%%.*}\\." 
    hint: "Toolchain did not provision. Check: limactl shell dev -- sudo journalctl -u cloud-final"
  - description: "IDE backend prerequisites"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      # Below ~500k the IDE quietly stops watching files and starts rescanning.
      test "$(sysctl -n fs.inotify.max_user_watches)" -ge 524288
      ldconfig -p | grep -q libXext
    hint: "IDE prerequisites missing. Gateway may connect and then drop the backend."
  - description: "Electron prerequisites"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      command -v xvfb-run
      ldconfig -p | grep -q libgtk-3
      # Without this, Electron aborts on the SUID sandbox helper.
      test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" -eq 0
    hint: "Electron will not launch. Check xvfb, libgtk-3 and the userns sysctl."
  - description: "VNC display :99"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      timeout 120s bash -c 'until systemctl is-active --quiet devvm-vnc.service; do sleep 2; done'
      timeout 30s bash -c 'until ss -ltn | grep -q "127.0.0.1:5901 "; do sleep 1; done'
    hint: "No viewable display. Check: limactl shell dev -- systemctl status devvm-display devvm-vnc"
  - description: "SonarQube"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      command -v sonar-scanner
      command -v sonar-check
      # First start creates its database and indexes: allow a few minutes.
      timeout 300s bash -c 'until curl -fsS http://localhost:9000/api/system/status | grep -q "\"status\":\"UP\""; do sleep 5; done'
    hint: "SonarQube is not up. Check: limactl shell dev -- docker logs sonarqube"
  - description: "MkDocs"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      "$HOME/.local/bin/mkdocs" --version
    hint: "mkdocs is missing. Run in the VM: pipx install --include-deps mkdocs-material"
  - description: "Hugo + AsciiDoc"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      hugo version | grep -q extended
      asciidoctor --version
      asciidoctor-pdf --version
    hint: "hugo, asciidoctor or asciidoctor-pdf is missing. Re-run ./update-vm.sh and check its warnings"
  - description: "Postgres (dev database)"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      timeout 300s bash -c 'until psql service=dev_ro -tAc "select 1" | grep -q 1; do sleep 5; done'
      # The read-only role must stay read-only. An `if`, not `!`: set -e
      # ignores a negated command, so `! psql ...` could never fail the probe.
      if psql service=dev_ro -c "create table devvm_probe ()" 2>/dev/null; then exit 1; fi
    hint: "Dev database is not up. Check: limactl shell dev -- docker logs postgres"

message: |
  Dev VM is up.

  Wire it to the Claude Code desktop app:
    limactl show-ssh {{.Name}} --format=config >> ~/.ssh/config
  then add SSH host `lima-{{.Name}}` in the app's environment dropdown.

  Then, once, inside the VM:
    ./setup-github.sh

  WebStorm, on the host:
    brew install --cask jetbrains-gateway
    Gateway -> SSH -> lima-{{.Name}} -> project dir under ~/projects/current
  Gateway downloads the backend into the VM on first connect.
